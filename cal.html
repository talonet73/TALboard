<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TALboard · Calendario</title><link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#ECEFF1;background:linear-gradient(165deg,#353a41,#0b0c0e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
img{width:84px;height:84px}h1{margin:0;font-size:22px}p{margin:0;color:#9aa3ac;font-size:15px;line-height:1.5;max-width:340px}
.ev{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;font-size:15px;max-width:340px;width:100%;box-sizing:border-box;text-align:left}
.ev b{display:block;font-size:17px}
a.btn{display:block;width:100%;max-width:340px;padding:16px;border-radius:16px;font-weight:800;font-size:17px;text-decoration:none;box-sizing:border-box}
.pri{background:linear-gradient(135deg,#E3B04B,#C8962E);color:#1a1206}.sec{background:rgba(255,255,255,.09);color:#ECEFF1;border:1px solid rgba(255,255,255,.12)}
</style></head><body>
<img src="icons/logo-256.png" alt=""><h1>Invia a Calendario iPhone</h1>
<div id="list"></div>
<a class="btn pri" id="add" href="#">📅 Apri nel Calendario</a>
<p>Nella schermata del Calendario tocca <b>Aggiungi</b>.<br>Poi torna all'app con <b>◀ TALboard</b> in alto a sinistra.</p>
<script>
const b64 = location.hash.slice(1);
let ics = '';
try { const bin = atob(b64.replace(/-/g,'+').replace(/_/g,'/')); ics = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); } catch(e){}
const un = v => v.replace(/\\n/g,'\n').replace(/\\([,;\\])/g,'$1');
const fmt = v => { const m = v.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)/); return m ? `${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]}` : v; };
const evs = ics.split('BEGIN:VEVENT').slice(1).map(x => ({t: un((x.match(/SUMMARY:(.*)/)||[])[1]||''), s: fmt((x.match(/DTSTART:(.*)/)||[])[1]||''), r: /RRULE/.test(x)}));
document.getElementById('list').innerHTML = evs.map(e => `<div class="ev" style="margin-bottom:8px"><b>${e.t.replace(/</g,'&lt;')}</b>${e.s}${e.r?' · ↻ ricorrente':''}</div>`).join('') || '<p>Nessun evento ricevuto.</p>';
const dataUrl = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
// metodo 1: link data: (Safari lo passa al Calendario) · metodo 2: file .ics scaricato
let m1 = function(){ location.href = dataUrl; };
function m2(){ const blob = new Blob([ics], {type:'text/calendar'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'TALboard.ics'; document.body.appendChild(a); a.click(); a.remove(); }
document.getElementById('add').onclick = e => { e.preventDefault(); m1(); };
// chiude la finestra e riporta a TALboard
function back(){ try { window.close(); } catch(e){}  }
// quando la scheda del Calendario si chiude (Aggiungi o Annulla), torno da solo all'app
let opened = false, away = false;
const m1orig = m1; m1 = () => { opened = true; m1orig(); };
const left = () => { if (opened) away = true; };
const returned = () => { if (opened && away) setTimeout(back, 350); };
window.addEventListener('blur', left); window.addEventListener('focus', returned);
document.addEventListener('visibilitychange', () => document.hidden ? left() : returned());
const mode = new URLSearchParams(location.search).get('m');
if (mode === 'blob'){ document.getElementById('add').onclick = e => { e.preventDefault(); m2(); }; setTimeout(m2, 500); }
else if (ics) setTimeout(m1, 500);
</script></body></html>
